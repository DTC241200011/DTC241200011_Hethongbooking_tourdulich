<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1200" viewBox="0 0 1740 1200" role="img" aria-labelledby="title description">
  <title id="title">Sơ đồ ERD cơ sở dữ liệu VietTour</title>
  <desc id="description">Ba bảng tours, itineraries và bookings với các khóa chính, khóa ngoại và quan hệ một-nhiều.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52657a; }
      .table-title { font-size: 22px; font-weight: 700; fill: #fff; }
      .field { font-size: 15px; }
      .type { font-size: 14px; fill: #52657a; }
      .key { font-size: 11px; font-weight: 700; }
      .relation { font-size: 14px; font-weight: 700; fill: #475569; }
      .note { font-size: 13px; fill: #52657a; }
      .row { fill: #fff; }
      .row-alt { fill: #f8fafc; }
      .card { fill: #fff; stroke-width: 2; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1740" height="1080" fill="#f8fafc"/>
  <text x="50" y="58" class="title">Sơ đồ ERD cơ sở dữ liệu VietTour</text>
  <text x="50" y="88" class="subtitle">Các bảng và kiểu dữ liệu theo database/init.sql · PK: khóa chính · FK: khóa ngoại · UNIQUE: giá trị duy nhất</text>

  <path d="M535 220 H580 V262 H620" class="connector"/>
  <path d="M535 220 H590 V716 H620" class="connector"/>
  <text x="545" y="207" class="relation">1</text>
  <text x="598" y="255" class="relation">N</text>
  <text x="598" y="710" class="relation">N</text>

  <rect x="50" y="140" width="485" height="760" rx="12" class="card" stroke="#3b82f6"/>
  <path d="M62 140 H523 Q535 140 535 152 V198 H50 V152 Q50 140 62 140 Z" fill="#2563eb"/>
  <text x="76" y="178" class="table-title">tours</text>
  <text x="510" y="176" class="key" text-anchor="end" fill="#dbeafe">DANH MỤC TOUR</text>

  <rect x="51" y="199" width="483" height="42" class="row-alt"/>
  <text x="76" y="226" class="field" font-weight="700">id</text><text x="345" y="226" class="type">SERIAL</text><rect x="451" y="209" width="56" height="22" rx="11" fill="#dbeafe"/><text x="479" y="224" class="key" text-anchor="middle" fill="#1d4ed8">PK</text>
  <rect x="51" y="241" width="483" height="42" class="row"/>
  <text x="76" y="268" class="field">title</text><text x="345" y="268" class="type">VARCHAR(255) · NOT NULL</text>
  <rect x="51" y="283" width="483" height="42" class="row-alt"/>
  <text x="76" y="310" class="field">destination</text><text x="345" y="310" class="type">VARCHAR(100) · NOT NULL</text>
  <rect x="51" y="325" width="483" height="42" class="row"/>
  <text x="76" y="352" class="field">duration</text><text x="345" y="352" class="type">VARCHAR(50) · NOT NULL</text>
  <rect x="51" y="367" width="483" height="42" class="row-alt"/>
  <text x="76" y="394" class="field">price</text><text x="345" y="394" class="type">NUMERIC(12,2) · NOT NULL</text>
  <rect x="51" y="409" width="483" height="42" class="row"/>
  <text x="76" y="436" class="field">max_participants</text><text x="345" y="436" class="type">INT · DEFAULT 30</text>
  <rect x="51" y="451" width="483" height="42" class="row-alt"/>
  <text x="76" y="478" class="field">image_url</text><text x="345" y="478" class="type">TEXT</text>
  <rect x="51" y="493" width="483" height="42" class="row"/>
  <text x="76" y="520" class="field">description</text><text x="345" y="520" class="type">TEXT</text>
  <rect x="51" y="535" width="483" height="42" class="row-alt"/>
  <text x="76" y="562" class="field">departure_location</text><text x="345" y="562" class="type">VARCHAR(100)</text>
  <rect x="51" y="577" width="483" height="42" class="row"/>
  <text x="76" y="604" class="field">transport</text><text x="345" y="604" class="type">VARCHAR(100)</text>
  <rect x="51" y="619" width="483" height="42" class="row-alt"/>
  <text x="76" y="646" class="field">featured</text><text x="345" y="646" class="type">BOOLEAN · DEFAULT false</text>
  <rect x="51" y="661" width="483" height="42" class="row"/>
  <text x="76" y="688" class="field">is_active</text><text x="345" y="688" class="type">BOOLEAN · DEFAULT true</text>
  <rect x="51" y="703" width="483" height="42" class="row-alt"/>
  <text x="76" y="730" class="field">created_at</text><text x="345" y="730" class="type">TIMESTAMPTZ</text>
  <rect x="51" y="745" width="483" height="42" class="row"/>
  <text x="76" y="772" class="field">updated_at</text><text x="345" y="772" class="type">TIMESTAMPTZ</text>
  <text x="76" y="836" class="note">Tour có thể có nhiều lịch trình và nhiều đơn đặt chỗ.</text>

  <rect x="620" y="140" width="485" height="378" rx="12" class="card" stroke="#16a34a"/>
  <path d="M632 140 H1093 Q1105 140 1105 152 V198 H620 V152 Q620 140 632 140 Z" fill="#16a34a"/>
  <text x="646" y="178" class="table-title">itineraries</text>
  <text x="1080" y="176" class="key" text-anchor="end" fill="#dcfce7">LỊCH TRÌNH THEO NGÀY</text>
  <rect x="621" y="199" width="483" height="42" class="row-alt"/>
  <text x="646" y="226" class="field" font-weight="700">id</text><text x="915" y="226" class="type">SERIAL</text><rect x="1021" y="209" width="56" height="22" rx="11" fill="#dcfce7"/><text x="1049" y="224" class="key" text-anchor="middle" fill="#15803d">PK</text>
  <rect x="621" y="241" width="483" height="42" class="row"/>
  <text x="646" y="268" class="field" font-weight="700">tour_id</text><text x="915" y="268" class="type">INT · NOT NULL</text><rect x="1021" y="251" width="56" height="22" rx="11" fill="#fef3c7"/><text x="1049" y="266" class="key" text-anchor="middle" fill="#b45309">FK</text>
  <rect x="621" y="283" width="483" height="42" class="row-alt"/>
  <text x="646" y="310" class="field">day_number</text><text x="915" y="310" class="type">INT · NOT NULL</text>
  <rect x="621" y="325" width="483" height="42" class="row"/>
  <text x="646" y="352" class="field">title</text><text x="915" y="352" class="type">VARCHAR(255) · NOT NULL</text>
  <rect x="621" y="367" width="483" height="42" class="row-alt"/>
  <text x="646" y="394" class="field">description</text><text x="915" y="394" class="type">TEXT · NOT NULL</text>
  <rect x="621" y="409" width="483" height="42" class="row"/>
  <text x="646" y="436" class="field">meals</text><text x="915" y="436" class="type">VARCHAR(100)</text>
  <rect x="621" y="451" width="483" height="42" class="row-alt"/>
  <text x="646" y="478" class="field">created_at</text><text x="915" y="478" class="type">TIMESTAMPTZ</text>
  <text x="646" y="551" class="note">FK: tours(id) · ON DELETE CASCADE</text>

  <rect x="620" y="570" width="485" height="575" rx="12" class="card" stroke="#f97316"/>
  <path d="M632 570 H1093 Q1105 570 1105 582 V628 H620 V582 Q620 570 632 570 Z" fill="#ea580c"/>
  <text x="646" y="608" class="table-title">bookings</text>
  <text x="1080" y="606" class="key" text-anchor="end" fill="#ffedd5">ĐƠN ĐẶT CHỖ</text>
  <rect x="621" y="629" width="483" height="35" class="row-alt"/>
  <text x="646" y="652" class="field" font-weight="700">id</text><text x="915" y="652" class="type">SERIAL</text><rect x="1021" y="635" width="56" height="22" rx="11" fill="#dbeafe"/><text x="1049" y="650" class="key" text-anchor="middle" fill="#1d4ed8">PK</text>
  <rect x="621" y="664" width="483" height="35" class="row"/>
  <text x="646" y="687" class="field">booking_code</text><text x="915" y="687" class="type">VARCHAR(20) · NOT NULL</text><rect x="1007" y="670" width="70" height="22" rx="11" fill="#f3e8ff"/><text x="1042" y="685" class="key" text-anchor="middle" fill="#7e22ce">UNIQUE</text>
  <rect x="621" y="699" width="483" height="35" class="row-alt"/>
  <text x="646" y="722" class="field" font-weight="700">tour_id</text><text x="915" y="722" class="type">INT · NOT NULL</text><rect x="1021" y="705" width="56" height="22" rx="11" fill="#fef3c7"/><text x="1049" y="720" class="key" text-anchor="middle" fill="#b45309">FK</text>
  <rect x="621" y="734" width="483" height="35" class="row"/>
  <text x="646" y="757" class="field">customer_name</text><text x="915" y="757" class="type">VARCHAR(100) · NOT NULL</text>
  <rect x="621" y="769" width="483" height="35" class="row-alt"/>
  <text x="646" y="792" class="field">customer_email</text><text x="915" y="792" class="type">VARCHAR(100) · NOT NULL</text>
  <rect x="621" y="804" width="483" height="35" class="row"/>
  <text x="646" y="827" class="field">customer_phone</text><text x="915" y="827" class="type">VARCHAR(20) · NOT NULL</text>
  <rect x="621" y="839" width="483" height="35" class="row-alt"/>
  <text x="646" y="862" class="field">departure_date</text><text x="915" y="862" class="type">DATE · NOT NULL</text>
  <rect x="621" y="874" width="483" height="35" class="row"/>
  <text x="646" y="897" class="field">adults_count</text><text x="915" y="897" class="type">INT · DEFAULT 1</text>
  <rect x="621" y="909" width="483" height="35" class="row-alt"/>
  <text x="646" y="932" class="field">children_count</text><text x="915" y="932" class="type">INT · DEFAULT 0</text>
  <rect x="621" y="944" width="483" height="35" class="row"/>
  <text x="646" y="967" class="field">total_price</text><text x="915" y="967" class="type">NUMERIC(12,2) · NOT NULL</text>
  <rect x="621" y="979" width="483" height="35" class="row-alt"/>
  <text x="646" y="1002" class="field">notes</text><text x="915" y="1002" class="type">TEXT</text>
  <rect x="621" y="1014" width="483" height="35" class="row"/>
  <text x="646" y="1037" class="field">status</text><text x="915" y="1037" class="type">VARCHAR(20) · CHECK</text>
  <rect x="621" y="1049" width="483" height="35" class="row-alt"/>
  <text x="646" y="1072" class="field">created_at</text><text x="915" y="1072" class="type">TIMESTAMPTZ</text>
  <rect x="621" y="1084" width="483" height="35" class="row"/>
  <text x="646" y="1107" class="field">updated_at</text><text x="915" y="1107" class="type">TIMESTAMPTZ</text>
  <text x="646" y="1167" class="note">FK: tours(id) · ON DELETE RESTRICT · status: PENDING / CONFIRMED / CANCELLED</text>

  <rect x="1170" y="140" width="520" height="250" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1200" y="182" class="table-title" fill="#172033">Quan hệ</text>
  <text x="1200" y="226" class="field"><tspan font-weight="700">tours (1) → itineraries (N)</tspan></text>
  <text x="1200" y="252" class="note">Một tour gồm nhiều mục lịch trình.</text>
  <text x="1200" y="303" class="field"><tspan font-weight="700">tours (1) → bookings (N)</tspan></text>
  <text x="1200" y="329" class="note">Một tour có thể được nhiều khách đặt.</text>
  <text x="1200" y="367" class="note">Mỗi bản ghi itineraries/bookings thuộc một tour.</text>

  <rect x="1170" y="420" width="520" height="260" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1200" y="462" class="table-title" fill="#172033">Chú giải</text>
  <rect x="1200" y="490" width="56" height="24" rx="12" fill="#dbeafe"/><text x="1228" y="507" class="key" text-anchor="middle" fill="#1d4ed8">PK</text>
  <text x="1272" y="507" class="note">Primary Key · khóa chính</text>
  <rect x="1200" y="529" width="56" height="24" rx="12" fill="#fef3c7"/><text x="1228" y="546" class="key" text-anchor="middle" fill="#b45309">FK</text>
  <text x="1272" y="546" class="note">Foreign Key · khóa ngoại</text>
  <rect x="1200" y="568" width="70" height="24" rx="12" fill="#f3e8ff"/><text x="1235" y="585" class="key" text-anchor="middle" fill="#7e22ce">UNIQUE</text>
  <text x="1286" y="585" class="note">Giá trị không trùng lặp</text>
  <path d="M1200 632 H1275" class="connector"/>
  <text x="1290" y="637" class="note">Đường nối: quan hệ một-nhiều</text>
</svg>
