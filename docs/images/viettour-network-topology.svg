<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1030" viewBox="0 0 1480 1030" role="img" aria-labelledby="title description">
  <title id="title">Sơ đồ phân vùng mạng Docker của VietTour</title>
  <desc id="description">Bốn mạng Docker và các container tham gia từng mạng, theo docker-compose.yml.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52657a; }
      .net-title { font-size: 20px; font-weight: 700; }
      .net-detail { font-size: 13px; fill: #52657a; }
      .card-name { font-size: 14px; font-weight: 700; }
      .card-role { font-size: 12px; fill: #52657a; }
      .section-note { font-size: 13px; fill: #475569; }
      .badge { font-size: 12px; font-weight: 700; }
      .card { fill: #fff; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect width="1480" height="1030" fill="#f8fafc"/>
  <text x="48" y="56" class="title">Phân vùng mạng Docker VietTour</text>
  <text x="48" y="84" class="subtitle">Thành viên từng mạng được đối chiếu theo docker-compose.yml · thẻ lặp lại là cùng một container nối vào nhiều mạng</text>

  <rect x="48" y="118" width="1384" height="207" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="76" y="157" class="net-title" fill="#1d4ed8">frontend_net</text>
  <text x="76" y="181" class="net-detail">Bridge · mạng giao tiếp giao diện và reverse proxy</text>
  <rect x="76" y="207" width="238" height="88" class="card" stroke="#3b82f6"/>
  <text x="92" y="238" class="card-name">tour_nginx_proxy</text>
  <text x="92" y="262" class="card-role">Reverse proxy · cổng host 8080/8443</text>
  <rect x="338" y="207" width="238" height="88" class="card" stroke="#3b82f6"/>
  <text x="354" y="238" class="card-name">tour_web_app</text>
  <text x="354" y="262" class="card-role">Ứng dụng web · :3000</text>
  <rect x="600" y="207" width="238" height="88" class="card" stroke="#3b82f6"/>
  <text x="616" y="238" class="card-name">tour_pgadmin</text>
  <text x="616" y="262" class="card-role">Quản trị DB · cổng host 5050</text>
  <rect x="862" y="207" width="238" height="88" class="card" stroke="#3b82f6"/>
  <text x="878" y="238" class="card-name">tour_nginx_exporter</text>
  <text x="878" y="262" class="card-role">Đọc /nginx_status · :9113</text>
  <rect x="1124" y="207" width="238" height="88" class="card" stroke="#3b82f6"/>
  <text x="1140" y="238" class="card-name">tour_grafana</text>
  <text x="1140" y="262" class="card-role">Dashboard · cổng host 3001</text>

  <rect x="48" y="347" width="1384" height="168" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="76" y="387" class="net-title" fill="#15803d">backend_net</text>
  <rect x="280" y="365" width="142" height="28" rx="14" fill="#dcfce7" stroke="#22c55e"/>
  <text x="301" y="384" class="badge" fill="#166534">internal: true</text>
  <text x="76" y="413" class="net-detail">Bridge nội bộ · không có cổng PostgreSQL ánh xạ ra host</text>
  <rect x="76" y="432" width="350" height="64" class="card" stroke="#22c55e"/>
  <text x="94" y="458" class="card-name">tour_web_app</text>
  <text x="94" y="479" class="card-role">Kết nối cơ sở dữ liệu :5432</text>
  <rect x="565" y="432" width="350" height="64" class="card" stroke="#22c55e"/>
  <text x="583" y="458" class="card-name">tour_postgres</text>
  <text x="583" y="479" class="card-role">PostgreSQL 16 · dữ liệu bền vững</text>
  <rect x="1000" y="432" width="350" height="64" class="card" stroke="#22c55e"/>
  <text x="1018" y="458" class="card-name">tour_postgres_exporter</text>
  <text x="1018" y="479" class="card-role">Thu thập metric PostgreSQL · :9187</text>

  <rect x="48" y="537" width="1384" height="142" rx="16" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
  <text x="76" y="577" class="net-title" fill="#be185d">admin_net</text>
  <rect x="208" y="555" width="142" height="28" rx="14" fill="#fce7f3" stroke="#ec4899"/>
  <text x="229" y="574" class="badge" fill="#9d174d">internal: true</text>
  <text x="76" y="606" class="net-detail">Bridge nội bộ dành riêng cho kết nối quản trị cơ sở dữ liệu</text>
  <rect x="350" y="613" width="350" height="52" class="card" stroke="#ec4899"/>
  <text x="370" y="645" class="card-name">tour_pgadmin</text>
  <rect x="780" y="613" width="350" height="52" class="card" stroke="#ec4899"/>
  <text x="800" y="645" class="card-name">tour_postgres</text>

  <rect x="48" y="701" width="1384" height="273" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="76" y="741" class="net-title" fill="#6d28d9">monitoring_net</text>
  <text x="76" y="766" class="net-detail">Bridge phục vụ Prometheus, exporters, Grafana và logging</text>
  <rect x="76" y="790" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="92" y="819" class="card-name">tour_web_app</text>
  <text x="92" y="841" class="card-role">/metrics · :3000</text>
  <rect x="338" y="790" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="354" y="819" class="card-name">tour_nginx_proxy</text>
  <text x="354" y="841" class="card-role">Nginx status · :80</text>
  <rect x="600" y="790" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="616" y="819" class="card-name">tour_postgres_exporter</text>
  <text x="616" y="841" class="card-role">DB metrics · :9187</text>
  <rect x="862" y="790" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="878" y="819" class="card-name">tour_nginx_exporter</text>
  <text x="878" y="841" class="card-role">Nginx metrics · :9113</text>
  <rect x="1124" y="790" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="1140" y="819" class="card-name">tour_cadvisor</text>
  <text x="1140" y="841" class="card-role">Container metrics · :8080</text>
  <rect x="76" y="879" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="92" y="908" class="card-name">tour_prometheus</text>
  <text x="92" y="930" class="card-role">Scraper · cổng host 9090</text>
  <rect x="338" y="879" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="354" y="908" class="card-name">tour_grafana</text>
  <text x="354" y="930" class="card-role">Dashboard · cổng host 3001</text>
  <rect x="600" y="879" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="616" y="908" class="card-name">tour_loki</text>
  <text x="616" y="930" class="card-role">Log store · cổng host 3100</text>
  <rect x="862" y="879" width="238" height="70" class="card" stroke="#8b5cf6"/>
  <text x="878" y="908" class="card-name">tour_promtail</text>
  <text x="878" y="930" class="card-role">Log collector</text>
  <text x="1124" y="899" class="section-note">Metrics: Prometheus scrape</text>
  <text x="1124" y="921" class="section-note">Logs: Promtail gửi về Loki</text>
  <text x="1124" y="943" class="section-note">Grafana truy vấn Prometheus/Loki</text>

  <text x="48" y="1009" class="subtitle">Các container có mặt trên nhiều mạng: tour_web_app, tour_nginx_proxy, tour_pgadmin, tour_postgres, tour_grafana, tour_nginx_exporter và tour_postgres_exporter.</text>
</svg>
