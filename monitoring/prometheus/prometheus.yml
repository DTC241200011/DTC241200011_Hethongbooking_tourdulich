# ==============================================================================
# Prometheus Configuration for Tour Booking System (De 20)
# Student: Phi Duc Phi - DTC241200011
# ==============================================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Node.js Tour Booking Web Application (/metrics)
  - job_name: 'tour-booking-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web-app:3000']
        labels:
          service: 'tour-web-app'
          app: 'tour-booking'
          env: 'production'

  # 3. Nginx Reverse Proxy via nginx-prometheus-exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx-reverse-proxy'
          component: 'web-server'

  # 4. PostgreSQL Database via postgres_exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql-database'
          component: 'database'

  # 5. Docker Containers resource usage via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'docker-containers'
          component: 'infrastructure'

